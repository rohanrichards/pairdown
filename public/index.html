<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>spec-room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600;6..72,700&display=swap">
<style>
  :root {
    --paper:  #f1f4f0;
    --card:   #fbfcfa;
    --ink:    #171c19;
    --soft:   #5d6662;
    --faint:  #a8b0ab;
    --rule:   #d5dbd5;
    --accent: #24479e;
    --accent-ink: #24479e;
    --accent-bg:  #e7ecf7;
    --serif: "Newsreader", Georgia, serif;
    --sans:  "Archivo", system-ui, sans-serif;
    --mono:  "IBM Plex Mono", ui-monospace, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper:#121513; --card:#191d1a; --ink:#e7ebe6; --soft:#99a39d;
      --faint:#5c655f; --rule:#2a302c; --accent:#9db8ff;
      --accent-ink:#b9ccff; --accent-bg:#1b2334;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font-family: var(--sans); display: flex; flex-direction: column;
    -webkit-font-smoothing: antialiased;
  }

  /* ---- header ---- */
  header {
    display: flex; align-items: center; gap: 1.4rem;
    padding: .7rem 1.1rem; border-bottom: 1px solid var(--rule);
    background: var(--card); flex: 0 0 auto;
  }
  .brand { font-weight: 700; letter-spacing: -.02em; font-size: .95rem; }
  .brand span { color: var(--faint); font-weight: 500; }
  .status { display: flex; align-items: center; gap: 1rem;
            font-family: var(--mono); font-size: .68rem; color: var(--soft); }
  .dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; margin-right: .4rem; }
  .on { background: #2e9e5b; } .off { background: #b0453f; }
  .muted { color: var(--faint); }
  .grow { flex: 1; }
  #people { display: flex; gap: .35rem; flex-wrap: wrap; }
  .chip {
    font-family: var(--mono); font-size: .64rem; padding: .16rem .45rem;
    border: 1px solid; border-radius: 999px; white-space: nowrap;
  }
  button {
    font-family: var(--mono); font-size: .68rem; cursor: pointer;
    background: var(--accent); color: var(--paper); border: 1px solid var(--accent);
    padding: .35rem .7rem; border-radius: 3px;
  }
  button:hover { opacity: .9; }
  button.ghost { background: transparent; color: var(--soft); border-color: var(--rule); }
  button.small { padding: .22rem .5rem; font-size: .62rem; margin-top: .5rem; }

  /* ---- layout ---- */
  main { flex: 1; display: grid; grid-template-columns: minmax(0,1fr) 330px; min-height: 0; }
  #editor { min-height: 0; overflow: hidden; position: relative; }
  aside {
    border-left: 1px solid var(--rule); background: var(--card);
    overflow-y: auto; padding: 1rem .9rem; min-height: 0;
  }
  aside h2 {
    font-family: var(--mono); font-size: .64rem; letter-spacing: .12em;
    text-transform: uppercase; color: var(--faint); margin: 0 0 .8rem;
  }

  /* ---- the document itself ---- */
  .cm-editor { height: 100%; }
  .cm-content { font-family: var(--serif); }

  /* ---- agent activity ---- */
  /* display:flex outranks the UA [hidden] rule, so restore it explicitly */
  #thinking[hidden] { display: none; }
  #thinking {
    position: absolute; left: 50%; transform: translateX(-50%); bottom: 1.4rem;
    display: flex; align-items: center; gap: .5rem; z-index: 4;
    font-family: var(--mono); font-size: .68rem; color: var(--accent-ink);
    background: var(--accent-bg); border: 1px solid var(--accent);
    padding: .4rem .8rem; border-radius: 999px;
  }
  #thinking i {
    width: 6px; height: 6px; border-radius: 50%; background: var(--accent);
    animation: pulse 1.1s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100% { opacity:.25; transform:scale(.8) } 50% { opacity:1; transform:scale(1.15) } }
  @media (prefers-reduced-motion: reduce) { #thinking i { animation: none; opacity: 1; } }

  /* ---- comments ---- */
  .c {
    border: 1px solid var(--rule); border-left: 3px solid var(--rule);
    padding: .6rem .7rem; margin-bottom: .7rem; background: var(--paper); border-radius: 2px;
  }
  .c.agent { border-left-color: var(--accent); }
  .c.resolved { opacity: .45; }
  .c .meta {
    display: flex; align-items: center; gap: .4rem;
    font-family: var(--mono); font-size: .63rem; color: var(--soft); margin-bottom: .35rem;
  }
  .who-dot { width: 7px; height: 7px; border-radius: 50%; flex: 0 0 auto; }
  .badge {
    font-family: var(--mono); font-size: .58rem; background: var(--accent-bg);
    color: var(--accent-ink); padding: .1rem .32rem; border-radius: 2px; margin-left: auto;
  }
  .badge.working::after { content: ""; }
  .c .quote {
    font-family: var(--serif); font-size: .82rem; color: var(--soft); cursor: pointer;
    border-left: 2px solid var(--rule); padding-left: .5rem; margin: .35rem 0; font-style: italic;
  }
  .c .quote:hover { border-left-color: var(--accent); color: var(--ink); }
  .c .lost { color: #b0453f; font-family: var(--mono); font-size: .62rem; font-style: normal; }
  .c .body { font-size: .88rem; white-space: pre-wrap; line-height: 1.5; }
  .c .reply {
    margin-top: .5rem; padding-top: .5rem; border-top: 1px dashed var(--rule);
    font-size: .84rem; line-height: 1.5;
  }
  .c .reply b { font-family: var(--mono); font-size: .62rem; color: var(--accent-ink); font-weight: 500; }
  .empty { color: var(--faint); font-size: .84rem; line-height: 1.6; }

  /* ---- composer ---- */
  #composer {
    position: fixed; z-index: 20; width: 300px; display: none;
    background: var(--card); border: 1px solid var(--rule); border-radius: 4px;
    padding: .6rem; box-shadow: 0 8px 26px rgba(0,0,0,.18);
  }
  #composer textarea {
    width: 100%; height: 68px; font-family: var(--sans); font-size: .85rem;
    background: var(--paper); color: var(--ink); border: 1px solid var(--rule);
    border-radius: 3px; padding: .4rem; margin-bottom: .45rem; resize: none;
  }
  #composer textarea:focus, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .row { display: flex; gap: .4rem; }

  @media (max-width: 860px) {
    main { grid-template-columns: minmax(0,1fr); grid-template-rows: 1fr 240px; }
    aside { border-left: 0; border-top: 1px solid var(--rule); }
  }
</style>
</head>
<body>

<header>
  <div class="brand">spec&#8202;<span>room</span></div>
  <div class="status">
    <span><span class="dot off" id="wsdot"></span><span id="wsstate">connecting</span></span>
    <span><span class="dot off" id="agentdot"></span><span id="agentstate" class="muted">no agent attached</span></span>
  </div>
  <span class="grow"></span>
  <div id="people"></div>
  <button class="ghost" id="rename">name</button>
</header>

<main>
  <div id="editor">
    <div id="thinking" hidden><i></i> Claude is working…</div>
  </div>
  <aside>
    <h2>Comments</h2>
    <div id="comments"></div>
  </aside>
</main>

<div id="composer">
  <textarea id="ctext" placeholder="Comment on the selection. Mention @claude to ask the attached session."></textarea>
  <div class="row">
    <button id="cadd">Comment</button>
    <button class="ghost" id="ccancel">Cancel</button>
  </div>
</div>

<script type="module" src="/js/editor.js"></script>
</body>
</html>
