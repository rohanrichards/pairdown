<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>spec-room</title>
<style>
  :root {
    --paper:#f2f4f1; --card:#fff; --ink:#171c19; --soft:#5d6662;
    --rule:#d5dbd5; --accent:#24479e; --accent-bg:#e7ecf7;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root { --paper:#121513; --card:#191d1a; --ink:#e7ebe6; --soft:#99a39d;
            --rule:#2a302c; --accent:#9db8ff; --accent-bg:#1b2334; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--paper); color:var(--ink);
         font:15px/1.5 system-ui, sans-serif; height:100vh; display:flex; flex-direction:column; }
  header { display:flex; align-items:center; gap:1rem; padding:.6rem 1rem;
           border-bottom:1px solid var(--rule); font-family:var(--mono); font-size:.75rem; }
  header .grow { flex:1; }
  .dot { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:.4rem; }
  .on { background:#2e9e5b; } .off { background:#b0453f; }
  main { flex:1; display:grid; grid-template-columns: minmax(0,1fr) 340px; min-height:0; }
  #editor { border:0; outline:0; resize:none; padding:2rem 2.2rem; font:15px/1.7 var(--mono);
            background:transparent; color:var(--ink); width:100%; height:100%; }
  aside { border-left:1px solid var(--rule); overflow-y:auto; padding:1rem; background:var(--card); }
  aside h2 { font-family:var(--mono); font-size:.7rem; letter-spacing:.1em; text-transform:uppercase;
             color:var(--soft); margin:0 0 .8rem; }
  .c { border:1px solid var(--rule); border-left:3px solid var(--rule); padding:.6rem .7rem; margin-bottom:.7rem; }
  .c.agent { border-left-color:var(--accent); }
  .c.resolved { opacity:.5; }
  .c .meta { font-family:var(--mono); font-size:.65rem; color:var(--soft); margin-bottom:.3rem;
             display:flex; gap:.5rem; align-items:center; }
  .c .quote { font-family:var(--mono); font-size:.7rem; color:var(--soft);
              border-left:2px solid var(--rule); padding-left:.5rem; margin:.3rem 0; }
  .c .body { white-space:pre-wrap; }
  .c .lost { color:#b0453f; font-family:var(--mono); font-size:.65rem; }
  .c .reply { margin-top:.45rem; padding-top:.45rem; border-top:1px dashed var(--rule); font-size:.9em; }
  .c .reply b { font-family:var(--mono); font-size:.65rem; color:var(--accent); font-weight:500; }
  .badge { font-family:var(--mono); font-size:.6rem; background:var(--accent-bg);
           color:var(--accent); padding:.1rem .3rem; }
  button { font:inherit; font-family:var(--mono); font-size:.7rem; cursor:pointer;
           background:var(--accent); color:var(--paper); border:0; padding:.35rem .6rem; }
  button.ghost { background:transparent; color:var(--soft); border:1px solid var(--rule); }
  #composer { position:fixed; z-index:5; background:var(--card); border:1px solid var(--rule);
              padding:.5rem; width:300px; display:none; box-shadow:0 4px 14px rgba(0,0,0,.15); }
  #composer textarea { width:100%; height:64px; font:inherit; font-size:.85rem; margin-bottom:.4rem;
                       background:var(--paper); color:var(--ink); border:1px solid var(--rule); padding:.35rem; }
  .row { display:flex; gap:.4rem; }
  .empty { color:var(--soft); font-size:.85rem; }
</style>
</head>
<body>
<header>
  <span><span class="dot off" id="wsdot"></span><span id="wsstate">connecting</span></span>
  <span><span class="dot off" id="agentdot"></span><span id="agentstate">no agent attached</span></span>
  <span class="grow"></span>
  <span id="who"></span>
  <button class="ghost" id="rename">change name</button>
</header>
<main>
  <textarea id="editor" spellcheck="false" placeholder="loading..."></textarea>
  <aside>
    <h2>Comments</h2>
    <div id="comments"><p class="empty">Select text in the document to leave one.</p></div>
  </aside>
</main>

<div id="composer">
  <textarea id="ctext" placeholder="Comment. Mention @claude to ask the attached session."></textarea>
  <div class="row">
    <button id="cadd">Comment</button>
    <button class="ghost" id="ccancel">Cancel</button>
  </div>
</div>

<script type="module">
import * as Y from "https://esm.sh/yjs@13.6.32";

// ---- identity ---------------------------------------------------------------
function askName(force) {
  let n = localStorage.getItem("spec-room.name");
  if (!n || force) {
    n = (prompt("Your name (shown on comments)", n || "") || "").trim();
    if (n) localStorage.setItem("spec-room.name", n);
  }
  return n || "anonymous";
}
let ME = askName(false);
document.getElementById("who").textContent = ME;
document.getElementById("rename").onclick = () => {
  ME = askName(true);
  document.getElementById("who").textContent = ME;
};

// ---- doc + transport --------------------------------------------------------
const doc = new Y.Doc();
const content = doc.getText("content");
const comments = doc.getArray("comments");

const editor = document.getElementById("editor");
let applyingRemote = false;
let lastText = "";

const ws = new WebSocket("ws://" + location.host + "/ws");
ws.binaryType = "arraybuffer";

ws.onopen = () => {
  document.getElementById("wsdot").className = "dot on";
  document.getElementById("wsstate").textContent = "connected";
};
ws.onclose = () => {
  document.getElementById("wsdot").className = "dot off";
  document.getElementById("wsstate").textContent = "disconnected";
};
ws.onmessage = (ev) => {
  if (typeof ev.data === "string") {
    const m = JSON.parse(ev.data);
    if (m.type === "presence") {
      document.getElementById("agentdot").className = "dot " + (m.agent ? "on" : "off");
      document.getElementById("agentstate").textContent =
        (m.agent ? "agent attached" : "no agent attached") + " · " + m.humans + " here";
    }
    return;
  }
  applyingRemote = true;
  Y.applyUpdate(doc, new Uint8Array(ev.data), "remote");
  applyingRemote = false;
};

doc.on("update", (update, origin) => {
  if (origin === "remote") return;
  if (ws.readyState === 1) ws.send(update);
});

// ---- text binding -----------------------------------------------------------
// Diff on common prefix/suffix so a local keystroke becomes a minimal Yjs op
// rather than a whole-document replace. That is what lets two people type in
// different paragraphs without destroying each other's work.
function pushLocalEdit(oldStr, newStr) {
  let start = 0;
  const min = Math.min(oldStr.length, newStr.length);
  while (start < min && oldStr[start] === newStr[start]) start++;
  let endOld = oldStr.length, endNew = newStr.length;
  while (endOld > start && endNew > start && oldStr[endOld - 1] === newStr[endNew - 1]) {
    endOld--; endNew--;
  }
  doc.transact(() => {
    if (endOld > start) content.delete(start, endOld - start);
    if (endNew > start) content.insert(start, newStr.slice(start, endNew));
  }, "local");
}

editor.addEventListener("input", () => {
  if (applyingRemote) return;
  const next = editor.value;
  pushLocalEdit(lastText, next);
  lastText = next;
});

content.observe(() => {
  const text = content.toString();
  if (text === editor.value) { lastText = text; return; }
  const s = editor.selectionStart, e = editor.selectionEnd;
  const delta = text.length - editor.value.length;
  editor.value = text;
  lastText = text;
  editor.selectionStart = s + (s > 0 ? delta : 0);
  editor.selectionEnd = e + (e > 0 ? delta : 0);
});

// ---- comments ---------------------------------------------------------------
const b64 = {
  enc: (u) => btoa(String.fromCharCode.apply(null, Array.from(u))),
  dec: (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0)),
};
const anchorFor = (i) =>
  b64.enc(Y.encodeRelativePosition(Y.createRelativePositionFromTypeIndex(content, i)));
function resolveAnchor(a) {
  try {
    const abs = Y.createAbsolutePositionFromRelativePosition(
      Y.decodeRelativePosition(b64.dec(a)), doc);
    return abs ? abs.index : null;
  } catch (e) { return null; }
}

const composer = document.getElementById("composer");
let pending = null;

editor.addEventListener("mouseup", () => {
  const from = editor.selectionStart, to = editor.selectionEnd;
  if (from === to) { composer.style.display = "none"; return; }
  pending = { from: from, to: to, quote: editor.value.slice(from, to) };
  composer.style.display = "block";
  composer.style.left = "40px";
  composer.style.top = Math.min(window.innerHeight - 180, 140) + "px";
  document.getElementById("ctext").focus();
});
document.getElementById("ccancel").onclick = () => { composer.style.display = "none"; };
document.getElementById("cadd").onclick = () => {
  const body = document.getElementById("ctext").value.trim();
  if (!body || !pending) return;
  const m = new Y.Map();
  doc.transact(() => {
    m.set("id", Math.random().toString(36).slice(2, 10));
    m.set("author", ME);
    m.set("body", body);
    m.set("quote", pending.quote);
    m.set("anchorFrom", anchorFor(pending.from));
    m.set("anchorTo", anchorFor(pending.to));
    m.set("resolved", false);
    m.set("forAgent", /(^|\s)@claude\b/i.test(body));
    m.set("createdAt", new Date().toISOString());
    m.set("replies", new Y.Array());
    comments.push([m]);
  }, "local");
  document.getElementById("ctext").value = "";
  composer.style.display = "none";
};

function render() {
  const host = document.getElementById("comments");
  if (comments.length === 0) {
    host.innerHTML = '<p class="empty">Select text in the document to leave one.</p>';
    return;
  }
  host.innerHTML = "";
  for (const m of comments) {
    const from = resolveAnchor(m.get("anchorFrom"));
    const to = resolveAnchor(m.get("anchorTo"));
    const el = document.createElement("div");
    el.className = "c" + (m.get("forAgent") ? " agent" : "") + (m.get("resolved") ? " resolved" : "");

    const meta = document.createElement("div");
    meta.className = "meta";
    meta.textContent = m.get("author") + " · " + String(m.get("createdAt")).slice(11, 16);
    if (m.get("forAgent")) {
      const b = document.createElement("span");
      b.className = "badge"; b.textContent = "@claude";
      meta.appendChild(b);
    }
    el.appendChild(meta);

    const q = document.createElement("div");
    q.className = "quote";
    if (from === null || to === null) {
      q.innerHTML = '<span class="lost">anchor lost - the text was deleted</span>';
    } else {
      q.textContent = content.toString().slice(from, to).slice(0, 120) || "(empty)";
      q.style.cursor = "pointer";
      q.title = "Click to select this text";
      q.onclick = () => { editor.focus(); editor.setSelectionRange(from, to); };
    }
    el.appendChild(q);

    const body = document.createElement("div");
    body.className = "body";
    body.textContent = m.get("body");
    el.appendChild(body);

    const replies = m.get("replies");
    const list = replies && replies.toArray ? replies.toArray() : [];
    for (const r of list) {
      const rd = document.createElement("div");
      rd.className = "reply";
      const who = document.createElement("b");
      who.textContent = r.author + " ";
      rd.appendChild(who);
      rd.appendChild(document.createTextNode(r.body));
      el.appendChild(rd);
    }

    const btn = document.createElement("button");
    btn.className = "ghost";
    btn.style.marginTop = ".45rem";
    btn.textContent = m.get("resolved") ? "reopen" : "resolve";
    btn.onclick = () => m.set("resolved", !m.get("resolved"));
    el.appendChild(btn);

    host.appendChild(el);
  }
}
comments.observeDeep(render);
content.observe(render);
render();
</script>
</body>
</html>
