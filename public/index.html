<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>spec-room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600;6..72,700&display=swap">
<style>
  :root {
    --paper:  #f1f4f0;
    --card:   #fbfcfa;
    --ink:    #171c19;
    --soft:   #5d6662;
    --faint:  #a8b0ab;
    --rule:   #d5dbd5;
    --accent: #24479e;
    --accent-ink: #24479e;
    --accent-bg:  #e7ecf7;
    /* reserved for Claude — no human is ever assigned this */
    --claude:     #6d4bd6;
    --claude-bg:  #efe9fd;
    --hl-open:    #fdf3d4;
    --hl-agent:   #e7ecf7;
    --hl-dim:     #e4e7e3;
    --serif: "Newsreader", Georgia, serif;
    --sans:  "Archivo", system-ui, sans-serif;
    --mono:  "IBM Plex Mono", ui-monospace, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper:#121513; --card:#191d1a; --ink:#e7ebe6; --soft:#99a39d;
      --faint:#5c655f; --rule:#2a302c; --accent:#9db8ff;
      --accent-ink:#b9ccff; --accent-bg:#1b2334;
      --claude:#b39bff; --claude-bg:#241d3a;
      --hl-open:#3a3320; --hl-agent:#1b2334; --hl-dim:#232824;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font-family: var(--sans); display: flex; flex-direction: column;
    -webkit-font-smoothing: antialiased;
  }

  /* ---- header ---- */
  header {
    display: flex; align-items: center; gap: 1.4rem;
    padding: .7rem 1.1rem; border-bottom: 1px solid var(--rule);
    background: var(--card); flex: 0 0 auto;
  }
  .brand { font-weight: 700; letter-spacing: -.02em; font-size: .95rem; }
  .brand span { color: var(--faint); font-weight: 500; }
  .status { display: flex; align-items: center; gap: 1rem;
            font-family: var(--mono); font-size: .68rem; color: var(--soft); }
  .dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; margin-right: .4rem; }
  .on { background: #2e9e5b; } .off { background: #b0453f; }
  .muted { color: var(--faint); }
  .grow { flex: 1; }
  #people { display: flex; gap: .35rem; flex-wrap: wrap; }
  .chip {
    font-family: var(--mono); font-size: .64rem; padding: .16rem .45rem;
    border: 1px solid; border-radius: 999px; white-space: nowrap;
  }
  button {
    font-family: var(--mono); font-size: .68rem; cursor: pointer;
    background: var(--accent); color: var(--paper); border: 1px solid var(--accent);
    padding: .35rem .7rem; border-radius: 3px;
  }
  button:hover { opacity: .9; }
  button.ghost { background: transparent; color: var(--soft); border-color: var(--rule); }
  #sendclaude { background: var(--claude); border-color: var(--claude); margin-right: .4rem; }
  #sendclaude[disabled] { opacity: .4; cursor: default; }
  button.small { padding: .22rem .5rem; font-size: .62rem; margin-top: .5rem; }

  /* ---- layout ---- */
  main { flex: 1; display: grid; grid-template-columns: minmax(0,1fr) 330px; min-height: 0; }
  #editor { min-height: 0; overflow: hidden; position: relative; }
  aside {
    border-left: 1px solid var(--rule); background: var(--card);
    min-height: 0; overflow: hidden; position: relative;
  }
  aside h2 {
    font-family: var(--mono); font-size: .64rem; letter-spacing: .12em;
    text-transform: uppercase; color: var(--faint);
    margin: 0; padding: .7rem .9rem .5rem; border-bottom: 1px solid var(--rule);
    background: var(--card); position: relative; z-index: 2;
  }
  /* cards are absolutely positioned against their anchor's vertical position */
  #comments { position: absolute; inset: 2.1rem .9rem 2.1rem .9rem; }
  #detached[hidden] { display: none; }
  #detached {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 3;
    display: block; width: 100%; text-align: left;
    background: var(--card); border: 0; border-top: 1px solid var(--rule);
    border-radius: 0; color: var(--soft);
    font-family: var(--mono); font-size: .62rem; padding: .5rem .9rem; cursor: pointer;
  }
  #detached:hover { color: var(--ink); background: var(--paper); }
  #detached::before { content: "⚑ "; color: var(--faint); }

  /* ---- the document itself ---- */
  .cm-editor { height: 100%; }
  .cm-content { font-family: var(--serif); }

  /* ---- agent activity ---- */
  /* display:flex outranks the UA [hidden] rule, so restore it explicitly */
  #thinking[hidden] { display: none; }
  #thinking {
    position: absolute; left: 50%; transform: translateX(-50%); bottom: 1.4rem;
    display: flex; align-items: center; gap: .5rem; z-index: 4;
    font-family: var(--mono); font-size: .68rem; color: var(--accent-ink);
    background: var(--accent-bg); border: 1px solid var(--accent);
    padding: .4rem .8rem; border-radius: 999px;
  }
  #thinking i {
    width: 6px; height: 6px; border-radius: 50%; background: var(--accent);
    animation: pulse 1.1s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100% { opacity:.25; transform:scale(.8) } 50% { opacity:1; transform:scale(1.15) } }
  @media (prefers-reduced-motion: reduce) { #thinking i { animation: none; opacity: 1; } }

  /* ---- comment cards ---- */
  .cmt-empty { color: var(--faint); font-size: .84rem; line-height: 1.6; padding-top: .6rem; }
  .cmt {
    width: 100%; background: var(--paper); border: 1px solid var(--rule);
    border-left: 3px solid var(--rule); border-radius: 3px;
    padding: .5rem .6rem; cursor: pointer;
    transition: box-shadow .12s ease, border-color .12s ease;
  }
  .cmt-agent { border-left-color: var(--claude); }
  .cmt-focus { box-shadow: 0 2px 10px rgba(0,0,0,.14); border-color: var(--accent); }
  .cmt-dim { opacity: .5; }
  .cmt-dim:hover { opacity: .78; }
  .cmt-detached { border-left-style: dashed; }
  .cmt-was {
    font-family: var(--mono); font-size: .58rem; color: var(--faint);
    border-left: 2px solid var(--rule); padding-left: .4rem; margin-bottom: .3rem;
  }
  .cmt-danger:hover { color: #b0453f; border-color: #b0453f; }
  .cmt-armed { color: #b0453f !important; border-color: #b0453f !important; }
  .panel-delete { align-self: flex-end; }

  .cmt-meta { display: flex; align-items: center; gap: .35rem; margin-bottom: .3rem; }
  .cmt-who { width: 13px; height: 13px; border-radius: 50%; flex: 0 0 auto; }
  .cmt-who-agent { background: var(--claude-bg); display: grid; place-items: center; border-radius: 3px; }
  .cmt-agent-icon { width: 11px; height: 11px; fill: var(--claude); }
  .cmt-name { font-family: var(--mono); font-size: .63rem; color: var(--soft); }
  .cmt-name-agent { color: var(--claude); font-weight: 500; }
  .cmt-time { font-family: var(--mono); font-size: .58rem; color: var(--faint); margin-left: auto; }

  .cmt-gone { font-family: var(--mono); font-size: .58rem; color: var(--faint); margin-bottom: .25rem; }
  .cmt-body { font-size: .84rem; line-height: 1.45; white-space: pre-wrap; }
  .cmt-body-clamp {
    display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden;
  }
  .cmt-reply {
    margin-top: .45rem; padding-top: .4rem; border-top: 1px dashed var(--rule);
  }
  .cmt-reply-agent { border-top-color: var(--claude); }
  .cmt-expand {
    background: none; border: 0; padding: .3rem 0 0; margin: 0;
    color: var(--accent-ink); font-family: var(--mono); font-size: .62rem; cursor: pointer;
  }
  .cmt-expand:hover { text-decoration: underline; }
  .cmt-working {
    display: flex; align-items: center; gap: .35rem; margin-top: .4rem;
    font-family: var(--mono); font-size: .6rem; color: var(--claude);
  }
  .cmt-working i {
    width: 5px; height: 5px; border-radius: 50%; background: var(--claude);
    animation: pulse 1.1s ease-in-out infinite;
  }
  .cmt-actions { display: flex; gap: .3rem; margin-top: .45rem; }
  .cmt-mini {
    background: transparent; color: var(--soft); border: 1px solid var(--rule);
    font-family: var(--mono); font-size: .58rem; padding: .16rem .4rem; border-radius: 2px;
  }
  .cmt-mini:hover { color: var(--ink); border-color: var(--soft); }

  /* ---- highlights in the document ---- */
  .cmt-hl { border-radius: 2px; box-shadow: inset 0 -2px 0 rgba(0,0,0,.08); }
  .cmt-hl-open { background: var(--hl-open); }
  .cmt-hl-agent { background: var(--hl-agent); }
  .cmt-hl-resolved { background: var(--hl-dim); box-shadow: none; }
  .cmt-hl-focus { box-shadow: inset 0 -2px 0 var(--accent); }

  /* ---- expanded thread ---- */
  #panel[hidden] { display: none; }
  #panel {
    position: fixed; right: 1.2rem; top: 4rem; width: 420px; max-height: 74vh;
    display: flex; flex-direction: column; z-index: 30;
    background: var(--card); border: 1px solid var(--rule); border-radius: 5px;
    box-shadow: 0 12px 36px rgba(0,0,0,.22);
  }
  .panel-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: .55rem .7rem; border-bottom: 1px solid var(--rule);
    font-family: var(--mono); font-size: .66rem; color: var(--soft);
  }
  .panel-quote {
    font-family: var(--serif); font-style: italic; font-size: .84rem; color: var(--soft);
    border-left: 2px solid var(--accent); margin: .6rem .7rem; padding-left: .6rem;
    max-height: 6rem; overflow: auto;
  }
  .panel-quote-gone { border-left-color: var(--faint); font-style: normal;
    font-family: var(--mono); font-size: .66rem; }
  .panel-thread { overflow-y: auto; padding: 0 .7rem .4rem; }
  .panel-thread .cmt-reply:first-child { border-top: 0; margin-top: 0; padding-top: 0; }
  .panel-reply { border-top: 1px solid var(--rule); padding: .55rem .7rem; display: flex; gap: .4rem; }
  .panel-reply textarea {
    flex: 1; height: 54px; resize: none; font-family: var(--sans); font-size: .82rem;
    background: var(--paper); color: var(--ink); border: 1px solid var(--rule);
    border-radius: 3px; padding: .35rem;
  }

  /* ---- composer ---- */
  #composer {
    position: fixed; z-index: 20; width: 300px; display: none;
    background: var(--card); border: 1px solid var(--rule); border-radius: 4px;
    padding: .6rem; box-shadow: 0 8px 26px rgba(0,0,0,.18);
  }
  #composer textarea {
    width: 100%; height: 68px; font-family: var(--sans); font-size: .85rem;
    background: var(--paper); color: var(--ink); border: 1px solid var(--rule);
    border-radius: 3px; padding: .4rem; margin-bottom: .45rem; resize: none;
  }
  #composer textarea:focus, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .row { display: flex; gap: .4rem; }

  @media (max-width: 860px) {
    main { grid-template-columns: minmax(0,1fr); grid-template-rows: 1fr 240px; }
    aside { border-left: 0; border-top: 1px solid var(--rule); }
  }
</style>
</head>
<body>

<header>
  <div class="brand">spec&#8202;<span>room</span> <em id="roomname"></em></div>
  <div class="status">
    <span><span class="dot off" id="wsdot"></span><span id="wsstate">connecting</span></span>
    <span><span class="dot off" id="agentdot"></span><span id="agentstate" class="muted">no agent attached</span></span>
  </div>
  <span class="grow"></span>
  <div id="people"></div>
  <button id="sendclaude" disabled>send to claude</button>
  <button class="ghost" id="rename">name</button>
</header>

<main>
  <div id="editor">
    <div id="thinking" hidden><i></i> Claude is working…</div>
  </div>
  <aside>
    <h2>Comments</h2>
    <div id="comments"></div>
    <button id="detached" hidden></button>
  </aside>
</main>

<div id="panel" hidden></div>

<div id="composer">
  <textarea id="ctext" placeholder="Comment on the selection. Mention @claude to ask the attached session."></textarea>
  <div class="row">
    <button id="cadd">Comment</button>
    <button class="ghost" id="ccancel">Cancel</button>
  </div>
</div>

<script type="module" src="/js/editor.js"></script>
</body>
</html>
